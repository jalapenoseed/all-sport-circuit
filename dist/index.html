// Seeded scenery is stable between frames, including during a camera blend.
function venueNoise(a        , b = 0)         {
  let bits = Math.imul(a + 173, 0x45d9f3b) ^ Math.imul(b + 43, 0x119de1f3);
  bits = Math.imul(bits ^ (bits >>> 16), 0x45d9f3b);
  return ((bits ^ (bits >>> 16)) >>> 0) / 4294967296;
}

const venueSkyCache = new Map                           ();
function venueSky(kind        )                    {
  const cached = venueSkyCache.get(kind);
  if (cached) return cached;
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 180;
  const g = canvas.getContext('2d') ;
  const ice = kind === 'Hockey';
  const cool = kind === 'Golf' || kind === 'Tennis' || kind === 'Horse Racing';
  const colors = ice ? ['#47467e','#70679b','#9691b4','#b8b5c7','#ded4cd'] :
    cool ? ['#286284','#48859b','#74aca9','#a9c8ae','#ead3a2'] :
    ['#685387','#9c688c','#d28289','#f4ac88','#ffd39b'];
  g.fillStyle = colors[4]; g.fillRect(0,0,800,180);
  for (let i=0;i<4;i++) {
    const y = i * 27;
    g.fillStyle = colors[i]; g.fillRect(0,y,800,28);
    for (let x=0;x<800;x+=4) {
      if (venueNoise(x,i) > .4) g.fillRect(x,y+28,2,1);
    }
  }
  // Scanline-cut disc, hand-stepped to keep a hard pixel silhouette.
  const sunX = 552, sunY = 89;
  for (let y=-28;y<=28;y++) {
    if (y>10 && (y+28)%5===0) continue;
    const half = Math.round(Math.sqrt(784-y*y));
    g.fillStyle = y<5 ? '#fff4bc' : '#ffdc92';
    g.fillRect(sunX-half,sunY+y,half*2,1);
  }
  for (let layer=0;layer<2;layer++) {
    g.fillStyle = cool ? ['#7b9c92','#537e7a'][layer] : ['#b2808e','#846f87'][layer];
    for (let x=0;x<800;x+=3) {
      const rise = 11*Math.sin(x*.022+layer) + 7*Math.sin(x*.057) + 4*Math.sin(x*.091+layer*3);
      const top = Math.round(126+layer*13-rise);
      g.fillRect(x,top,3,180-top);
    }
  }
  if (!cool) {
    let x=-5;
    for (let i=0;x<805;i++) {
      const w = 6+Math.floor(venueNoise(i,1)*13);
      const tall = Math.round(6+venueNoise(i,2)*23+Math.max(0,Math.cos(x*.035))*12);
      const y = 147-tall;
      g.fillStyle='#565770'; g.fillRect(x,y,w,tall+15);
      g.fillStyle='#71687b'; g.fillRect(x,y,3,tall);
      if (i%4===0) {g.fillRect(x+2,y-3,w-4,3);g.fillRect(x+4,y-8,1,5);}
      g.fillStyle='#dca78b';
      for (let row=2;row<tall-3;row+=5) for (let col=3;col<w-1;col+=4)
        if (venueNoise(i+row,col)>.62) g.fillRect(x+col,y+row,2,1);
      x+=w+1+Math.floor(venueNoise(i,3)*5);
    }
  }
  // Tiny wooded rim breaks up the stadium silhouette.
  for (let x=0;x<800;x+=2) {
    const y = Math.floor(153-5*venueNoise(x,13)-4*Math.sin(x*.024));
    g.fillStyle = cool ? '#3d6665' : '#4a5463'; g.fillRect(x,y,2,180-y);
  }
  venueSkyCache.set(kind,canvas);
  return canvas;
}

const venueDigits                        = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111',
  '3':'111001111001111','4':'101101111001001','5':'111100111001111'
};

let venueBanner                               ;
function venueSignTexture()                    {
  if (venueBanner) return venueBanner;
  const board=document.createElement('canvas');
  board.width=132; board.height=18;
  const g=board.getContext('2d') ;
  g.fillStyle='#273344'; g.fillRect(0,0,132,18);
  g.fillStyle='#70beb1'; g.fillRect(0,0,132,1);
  g.fillStyle='#c7758a'; g.fillRect(0,16,132,2);
  for(let i=0;i<3;i++){
    g.fillStyle=i%2===0?'#5fbea9':'#f0d09a';
    g.beginPath();g.moveTo(3+i*4,12);g.lineTo(7+i*4,5);g.lineTo(10+i*4,5);g.lineTo(6+i*4,12);g.fill();
  }
  g.fillStyle='#f5e9c9';g.font='bold 11px monospace';
  g.fillText('ALL SPORT CIRCUIT',20,13);
  venueBanner=board;
  return board;
}

function drawVenue(ctx                          , project              , sport        , time        )       {
  const width = ctx.canvas.width, height = ctx.canvas.height;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.lineJoin = 'bevel';
  ctx.lineCap = 'butt';
  const outdoor = ['Golf','Horse Racing','Baseball'].includes(sport);
  const turf = ['Football','Soccer','Golf','Baseball','Horse Racing'].includes(sport);

  function polygon(points               , color        ) {
    if (points.length < 3) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i=0;i<points.length;i++) {
      const [x,y,z=0]=points[i];
      const p=project(x,y,z);
      if (!Number.isFinite(p.x+p.y)) return;
      if (i===0) ctx.moveTo(Math.round(p.x),Math.round(p.y));
      else ctx.lineTo(Math.round(p.x),Math.round(p.y));
    }
    ctx.closePath(); ctx.fill();
  }
  function quad(x1       ,y1       ,x2       ,y2       ,color       ,z=0) {
    polygon([[x1,y1,z],[x2,y1,z],[x2,y2,z],[x1,y2,z]],color);
  }
  function stroke(points              ,color       ,lineWidth=1) {
    ctx.strokeStyle=color; ctx.lineWidth=lineWidth; ctx.beginPath();
    points.forEach(([x,y,z=0],i)=>{
      const p=project(x,y,z);
      if (i===0) ctx.moveTo(Math.round(p.x)+.5,Math.round(p.y)+.5);
      else ctx.lineTo(Math.round(p.x)+.5,Math.round(p.y)+.5);
    });
    ctx.stroke();
  }
  function frame(x1       ,y1       ,x2       ,y2       ,color       ,lineWidth=1) {
    stroke([[x1,y1],[x2,y1],[x2,y2],[x1,y2],[x1,y1]],color,lineWidth);
  }
  function arc(x       ,y       ,rx       ,ry       ,from       ,to       ,color       ,filled=false) {
    const n=Math.max(10,Math.ceil((to-from)*5));
    const points              =[];
    for(let i=0;i<=n;i++) {
      const a=from+(to-from)*i/n;
      points.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry]);
    }
    if (filled) polygon(points,color); else stroke(points,color);
  }
  function disc(x       ,y       ,rx       ,ry       ,color       ) {
    arc(x,y,rx,ry,0,Math.PI*2,color,true);
  }
  function smallBox(x       ,y       ,w       ,d       ,h       ,top       ,front       ,side       ,z=0) {
    polygon([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],front);
    polygon([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],side);
    quad(x,y,x+w,y+d,top,z+h);
  }

  const sky = venueSky(sport);
  const far = project(0,-68,0);
  const horizon = Math.max(32,Math.min(height*.61,far.y-2));
  const skyScale = Math.max(width/736,(horizon+4)/168);
  const skyX = Math.round((width-800*skyScale)*.5);
  const skyY = Math.round(horizon-156*skyScale);
  ctx.fillStyle='#526b65'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle= sport==='Hockey'?'#47467e':(sport==='Golf'||sport==='Horse Racing'||sport==='Tennis')?'#286284':'#685387';
  ctx.fillRect(0,0,width,Math.max(0,skyY)+1);
  ctx.drawImage(sky,skyX,skyY,Math.ceil(800*skyScale),Math.ceil(180*skyScale));

  // Clouds use repeatable, stacked rectangular puffs instead of alpha gradients.
  for (let i=0;i<9;i++) {
    const x=Math.floor((venueNoise(i,17)*(width+130)+time*(1.6+i%3))%(width+130))-65;
    const y=Math.floor(horizon*(.08+venueNoise(i,19)*.39));
    const length=10+Math.floor(venueNoise(i,22)*28);
    ctx.fillStyle=outdoor?'#c9d5bd':'#f8c4a6';
    ctx.fillRect(x,y,length,2); ctx.fillRect(x+3,y-2,length-8,2);
    ctx.fillStyle=outdoor?'#eef0cc':'#ffe2b8';
    ctx.fillRect(x+7,y-4,Math.max(5,length/3|0),2);
    ctx.fillRect(x+length+4,y+1,7,1);
  }
  // A broad grassy apron extends beyond the playfield through every camera angle.
  quad(-220,-85,220,165,outdoor?'#497b58':'#46655c');
  for (let i=0;i<64;i++) {
    const x=-140+venueNoise(i,4)*280, y=-83+venueNoise(i,5)*167;

/* Original cartridge-cover illustrations. Scanline fills keep diagonal edges on
   the same pixel grid as the game at every display scale. */
function drawPoster(ctx                          , sport        )       {
  const ink = '#18203b', plum = '#52244c', pink = '#ba4770', rose = '#ee7085';
  const deep = '#085352', jade = '#14877a', teal = '#44c6aa', mint = '#9ce7be';
  const skin = '#c77555', light = '#f3b77a', pale = '#ffe5ac';
  const white = '#f5e5bf', silver = '#b6bda6', clay = '#b37242';
  const poly = (color        , points          ) => {
    ctx.fillStyle = color;
    const ys = points.filter((_, i) => i % 2 === 1);
    for (let y = Math.min(...ys); y < Math.max(...ys); y++) {
      const cuts           = [];
      for (let i = 0; i < points.length; i += 2) {
        const j = (i + 2) % points.length;
        const y0 = points[i + 1], y1 = points[j + 1], sy = y + .5;
        if ((y0 <= sy && sy < y1) || (y1 <= sy && sy < y0))
          cuts.push(points[i] + (sy - y0) * (points[j] - points[i]) / (y1 - y0));
      }
      cuts.sort((a, b) => a - b);
      for (let i = 0; i + 1 < cuts.length; i += 2) {
        const x = Math.round(cuts[i]);
        ctx.fillRect(x, y, Math.round(cuts[i + 1]) - x, 1);
      }
    }
  };
  const rect = (c        , x        , y        , w        , h        ) => {
    ctx.fillStyle = c; ctx.fillRect(x,y,w,h);
  };
  const rod = (c        , x        ,y        ,u        ,v        ,w        ) => {
    const count = Math.max(Math.abs(u-x),Math.abs(v-y),1);
    for(let i=0;i<=count;i++) rect(c,Math.round(x+(u-x)*i/count),Math.round(y+(v-y)*i/count),w,w);
  };
  const oval = (c       ,x       ,y       ,rx       ,ry       ) => {
    for (let dy=-ry;dy<=ry;dy++) {
      const dx=Math.floor(rx*Math.sqrt(1-dy*dy/(ry*ry)));
      rect(c,x-dx,y+dy,dx*2+1,1);
    }
  };
  const arm = (sx       ,sy       ,ex       ,ey       ,hx       ,hy       ) => {
    rod(ink,sx-5,sy-5,ex-5,ey-5,12); rod(ink,ex-5,ey-5,hx-3,hy-3,9);
    rod(skin,sx-3,sy-3,ex-4,ey-3,8); rod(skin,ex-3,ey-3,hx-2,hy-2,6);
    rod(light,sx-4,sy-3,ex-3,ey-3,3); rod(light,ex-3,ey-3,hx-2,hy-2,2);
    rect(light,hx-3,hy-3,7,6); rect(pale,hx-2,hy-3,4,2);
  };
  const football = () => {
    // Distant leg folds behind the lead thigh.
    poly(ink,[55,67,78,73,74,88,57,99,42,99,22,118,12,117,7,111,13,103,29,90,52,84]);
    poly(plum,[55,70,73,75,67,88,53,96,39,96,22,113,16,111,30,92,53,86]);
    poly(pink,[47,87,59,80,66,80,58,91,40,96,29,104,28,100]);
    poly(silver,[26,95,34,98,22,112,14,110]);
    poly(white,[25,96,29,98,20,106,16,107]);
    poly(deep,[12,104,20,107,19,114,11,114,8,111]);
    rect(teal,11,108,5,2);
    // Lead leg, high cuff and a chunky striped cleat.
    poly(ink,[62,67,87,66,91,72,105,82,108,89,104,96,92,111,100,116,100,120,92,123,72,121,69,117,78,103,86,91,62,88,52,78]);
    poly(plum,[62,71,85,70,94,79,103,85,105,91,93,103,82,102,88,92,66,87,57,81]);

function hitBases(count       ){

    bases[i]=false;

function formatStatus(){

function rules(){if(!fullMatch)return instructions[sport];const rules                      ={Baseball:"Time the swing at home plate. Three strikes make an out. While pitching, hold up for a changeup or down for a fastball. Runners score by circling the bases.",Golf:"Aim with A and D. Swing with Space. Water costs one penalty stroke and returns the ball to its last lie. Bunkers shorten your reach. Lowest total wins.",Tennis:"Serve or return with action. Win four points by two to take a game. At three games each, play a seven-point tiebreak.","Ping-Pong":"Press action to return. Service changes every two points, then every point at deuce.","Horse Racing":"Jump each rail, sprint on open ground and rest to recover. Stamina carries between heats."};return formats[sport]+". "+(rules[sport]||instructions[sport])}

function selectSport(index       ,noise=true){sport=names[(index+names.length)%names.length];const i=names.indexOf(sport),c=cards[i];get("sporttag").textContent=sport.toUpperCase();get("covername").innerHTML='<span>'+c[0]+'</span><span>'+c[1]+'</span>';get("venue").textContent="⌖  "+c[2].toUpperCase();get("surface").textContent=c[3];const ctx=get                   ("poster").getContext("2d") ;drawPoster(ctx,sport);document.querySelectorAll                   (".sport").forEach((b,j)=>{b.classList.toggle("active",i===j);b.setAttribute("aria-pressed",String(i===j))});formatDescription();drawBack();if(noise)tone("select")}
function drawBack(){const bg=get                   ("backdrop").getContext("2d") ;const proj=(x       ,y       ,z=0)=>{const depth=x*.12+y*.99,scale=5.3/(1-depth*.004);return {x:Math.round(320+(x*.99-y*.12)*scale),y:Math.round(236+(depth*.36-z*.94)*scale)}};drawVenue(bg,proj,sport,performance.now()/1000)}
function initSeg(id       ,value       ,fn                 ){const buttons=Array.from(get(id).querySelectorAll("button"));function pick(v       ){fn(v);buttons.forEach(b=>{b.classList.toggle("chosen",b.dataset.val===v);b.setAttribute("aria-pressed",String(b.dataset.val===v))})}for(const b of buttons)b.onclick=()=>{pick(b.dataset.val );tone("select")};pick(value)}

window.addEventListener("keydown",e=>{if(dlg.open)return;if(active){if(["Space","Enter","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Slash"].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==="Escape"){e.preventDefault();pauseMatch();return}if(e.code==="KeyC")switchView();keys.add(e.code);pressed.add(e.code)}else if(!e.altKey&&!e.ctrlKey&&!e.metaKey){if(e.code==="ArrowLeft"||e.code==="ArrowRight"){e.preventDefault();selectSport(names.indexOf(sport)+(e.code==="ArrowRight"?1:-1))}if(e.code==="Enter"&&(document.activeElement===document.body||document.activeElement?.classList.contains("sport"))){e.preventDefault();beginMatch()}}});
